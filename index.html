<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Stack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1><span class="pink">HAND</span> <span class="cyan">STACK</span></h1>
      <p class="tagline">a retro puzzle, played with your hands</p>
    </header>

    <main id="layout">
      <canvas id="game" width="480" height="600"></canvas>
    </main>

    <footer id="keys">
      ← → move · ↓ soft drop · ↑/X rotate ↻ · Z rotate ↺ · SPACE slam · C hold · P pause · ENTER start
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
